<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Download Game Arena - Offline Games for iOS and Android">

    <title>Game Arena - Offline Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        p {
            margin: 0 0 30px;
            font-size: 17px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button {
            display: block;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            background: white;
            color: #333;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .loading {
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.75;
        }

        .buttons.hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="icon.png"
        alt="Game Arena"
        class="logo"
    >

    <h1>Game Arena</h1>

    <p>
        12 classic puzzle, board and strategy games
        in one offline gaming app.
    </p>

    <div class="buttons hidden" id="downloadButtons">

        <a
            class="button"
            href="https://apps.apple.com/app/game-arena-offline-games/id6795797082">
            Download for iOS
        </a>

        <a
            class="button"
            href="https://play.google.com/store/apps/details?id=com.bhoyartech.tictactoe">
            Download for Android
        </a>

    </div>

    <div class="loading" id="loadingMessage">
        Opening Game Arena...
    </div>

</div>

<script>

    const iosURL =
        "https://apps.apple.com/app/game-arena-offline-games/id6795797082";

    const androidURL =
        "https://play.google.com/store/apps/details?id=com.bhoyartech.tictactoe";

    const userAgent =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera;

    // Detect iPhone, iPad and iPod
    const isIOS =
        /iPad|iPhone|iPod/i.test(userAgent) ||
        (
            navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1
        );

    // Detect Android
    const isAndroid =
        /Android/i.test(userAgent);

    const loadingMessage =
        document.getElementById("loadingMessage");

    const downloadButtons =
        document.getElementById("downloadButtons");


    /*
     * iOS
     */
    if (isIOS) {

        loadingMessage.textContent =
            "Opening App Store...";

        window.location.replace(iosURL);

    }

    /*
     * Android
     */
    else if (isAndroid) {

        loadingMessage.textContent =
            "Opening Google Play...";

        window.location.replace(androidURL);

    }

    /*
     * Desktop / Unknown device
     */
    else {

        loadingMessage.textContent =
            "Choose your platform to download Game Arena.";

        downloadButtons.classList.remove("hidden");

    }

</script>

</body>
</html>
